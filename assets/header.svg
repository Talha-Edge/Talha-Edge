<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Ambient Top Spotlight Glow (as seen in reference design) -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26262a" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#52525b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#26262a" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #ffffff;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      fill: #a1a1aa;
      text-transform: uppercase;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #71717a;
      letter-spacing: 1.5px;
    }
    .pulse {
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="848" height="198" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Background Dots -->
  <rect x="2" y="2" width="846" height="196" rx="13" fill="url(#dotGrid)" />

  <!-- Ambient Glow Spotlight -->
  <rect x="2" y="2" width="846" height="196" rx="13" fill="url(#topGlow)" />

  <!-- Top Decorative Status Bar -->
  <line x1="28" y1="36" x2="822" y2="36" stroke="#27272a" stroke-width="0.75" stroke-dasharray="4 4" />
  
  <!-- Status Indicator -->
  <circle cx="36" cy="24" r="4" fill="#22c55e" />
  <text x="48" y="27" class="badge">SYSTEM ONLINE // AVAILABLE FOR OPPORTUNITIES</text>
  <text x="815" y="27" text-anchor="end" class="badge">EST. 2026 • PAKISTAN</text>

  <!-- Main Center Header -->
  <!-- Subtle Header Backing Ambient Accent -->
  <circle cx="425" cy="105" r="140" fill="#ffffff" fill-opacity="0.02" />

  <text x="425" y="105" text-anchor="middle" class="title">TALHA SALEEM</text>
  <text x="425" y="138" text-anchor="middle" class="subtitle">SOFTWARE ENGINEER • PYTHON &amp; AI SYSTEMS ARCHITECT</text>

  <!-- Bottom Accent Line -->
  <line x1="365" y1="162" x2="485" y2="162" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" />
</svg>
